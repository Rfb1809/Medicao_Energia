<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Supervisório de Medidores - Alameda Xingu</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --panel-bg: #101726;
      --border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --ok: #10b981;
      --ok-glow: rgba(16, 185, 129, 0.25);
      --fail: #ef4444;
      --fail-glow: rgba(239, 68, 68, 0.25);
      --fail-bg: rgba(239, 68, 68, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-shell {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top Header */
    header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 4px 0;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    /* KPI Summary Pills */
    .kpi-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .kpi-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .kpi-value {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .kpi-value.ok { color: var(--ok); }
    .kpi-value.fail { color: var(--fail); }

    .kpi-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    /* Quick Filter Chips (Mobile Scrollable) */
    .selector-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .selector-bar::-webkit-scrollbar { display: none; }

    .btn-floor {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.78rem;
      white-space: nowrap;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .btn-floor:active, .btn-floor.active {
      background: var(--accent);
      border-color: #60a5fa;
      color: #fff;
    }

    /* Street Indicator */
    .street-tag {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #60a5fa;
      padding: 4px;
      border-bottom: 1px dashed rgba(96, 165, 250, 0.4);
    }

    /* Floor Plan Grid */
    .building-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 10px;
      width: 100%;
      background: rgba(21, 29, 48, 0.5);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      position: relative;
    }

    @media (min-width: 768px) {
      .building-grid {
        grid-template-columns: 260px 1fr 260px;
        grid-template-rows: 240px 1fr 240px;
        height: 520px;
      }

      .room-d { grid-column: 1; grid-row: 1; }
      .room-c { grid-column: 3; grid-row: 1; }
      .room-b { grid-column: 1; grid-row: 3; }
      .room-a { grid-column: 3; grid-row: 3; }

      .central-void {
        grid-column: 2 / 3;
        grid-row: 1 / 4;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        border: 1px dashed rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        margin: 8px;
        padding: 16px;
      }
    }

    @media (max-width: 767px) {
      .building-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .central-void {
        order: -1;
        padding: 8px;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 8px;
        text-align: center;
      }
    }

    .central-void strong {
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    .central-void span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Machine Rooms (Quinas) */
    .corner-room {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      max-height: 250px;
      overflow-y: auto;
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .room-name {
      font-weight: 800;
      font-size: 0.95rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .room-name small {
      font-weight: 500;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .room-badge {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Meters List & Items */
    .meters-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meter-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 7px 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s ease;
    }

    .meter-card.fail {
      background: var(--fail-bg);
      border-color: rgba(239, 68, 68, 0.25);
    }

    .meter-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .meter-id {
      font-weight: 700;
      font-size: 0.8rem;
      color: #fff;
    }

    .meter-meta {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .meter-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .pulse-dot.ok {
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok-glow);
    }

    .pulse-dot.fail {
      background: var(--fail);
      box-shadow: 0 0 6px var(--fail-glow);
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .empty-state {
      font-size: 0.72rem;
      color: #64748b;
      text-align: center;
      padding: 16px 0;
    }

    /* Sub-bar Filter Toggle */
    .filter-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }

    .btn-toggle-fail {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.72rem;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-toggle-fail.active {
      background: var(--fail-bg);
      border-color: var(--fail);
      color: var(--fail);
    }
  </style>
</head>
<body>

  <div class="app-shell">

    <header>
      <div class="title-row">
        <h1>Supervisório de Medição</h1>
      </div>
      <div class="street-tag">▲ Alameda Xingu ▲</div>
    </header>

    <!-- Resumo dos Indicadores -->
    <div class="kpi-bar">
      <div class="kpi-card">
        <span class="kpi-value" id="kpi-total">0</span>
        <span class="kpi-label">Total</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-value ok" id="kpi-ok">0</span>
        <span class="kpi-label">Online</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-value fail" id="kpi-fail">0</span>
        <span class="kpi-label">Falhas</span>
      </div>
    </div>

    <!-- Barra de Filtros por Pavimento -->
    <div class="selector-bar" id="floorSelector">
      <button class="btn-floor active" onclick="setFloor('ALL', this)">Todos</button>
      <button class="btn-floor" onclick="setFloor('1', this)">1º LIVELO</button>
      <button class="btn-floor" onclick="setFloor('2', this)">2º ELOPAR</button>
      <button class="btn-floor" onclick="setFloor('3', this)">3º ALELO</button>
      <button class="btn-floor" onclick="setFloor('4', this)">4º ALELO</button>
      <button class="btn-floor" onclick="setFloor('8', this)">8º ELOPAR</button>
      <button class="btn-floor" onclick="setFloor('11', this)">11º LIVELO</button>
      <button class="btn-floor" onclick="setFloor('16', this)">16º VELOE</button>
    </div>

    <div class="filter-actions">
      <button class="btn-toggle-fail" id="toggleFailBtn" onclick="toggleOnlyFailures()">
        Apenas falhas
      </button>
    </div>

    <!-- Planta das Casas de Máquinas -->
    <div class="building-grid">
      
      <!-- Central -->
      <div class="central-void">
        <strong id="floorDisplay">Vista Global</strong>
        <span>Vão Central</span>
      </div>

      <!-- Quina Noroeste: D -->
      <div class="corner-room room-d">
        <div class="room-header">
          <span class="room-name">D <small>Sup. Esq.</small></span>
          <span class="room-badge" id="count-D">0</span>
        </div>
        <div class="meters-list" id="list-D"></div>
      </div>

      <!-- Quina Nordeste: C -->
      <div class="corner-room room-c">
        <div class="room-header">
          <span class="room-name">C <small>Sup. Dir.</small></span>
          <span class="room-badge" id="count-C">0</span>
        </div>
        <div class="meters-list" id="list-C"></div>
      </div>

      <!-- Quina Sudoeste: B -->
      <div class="corner-room room-b">
        <div class="room-header">
          <span class="room-name">B <small>Inf. Esq.</small></span>
          <span class="room-badge" id="count-B">0</span>
        </div>
        <div class="meters-list" id="list-B"></div>
      </div>

      <!-- Quina Sudeste: A -->
      <div class="corner-room room-a">
        <div class="room-header">
          <span class="room-name">A <small>Inf. Dir.</small></span>
          <span class="room-badge" id="count-A">0</span>
        </div>
        <div class="meters-list" id="list-A"></div>
      </div>

    </div>

  </div>

  <script>
    const meters = [
      // 1º PAV (LIVELO)
      { id: 'QFAC-011', floor: '1', client: 'LIVELO', room: 'A', ip: '10.2.10.118', status: 'fail' },
      { id: 'QFAC-012', floor: '1', client: 'LIVELO', room: 'B', ip: '10.2.10.119', status: 'ok' },
      { id: 'QFAC-013', floor: '1', client: 'LIVELO', room: 'C', ip: '10.2.10.120', status: 'ok' },
      { id: 'QFAC-014', floor: '1', client: 'LIVELO', room: 'D', ip: '10.2.10.121', status: 'fail' },

      // 2º PAV (ELOPAR)
      { id: 'QFAC-023', floor: '2', client: 'ELOPAR', room: 'C', ip: '10.2.10.116', status: 'ok' },
      { id: 'QFAC-024', floor: '2', client: 'ELOPAR', room: 'D', ip: '10.2.10.117', status: 'ok' },

      // 3º PAV (ALELO)
      { id: 'QFAC-031', floor: '3', client: 'ALELO', room: 'A', ip: '10.2.10.112', status: 'fail' },
      { id: 'QFAC-032', floor: '3', client: 'ALELO', room: 'B', ip: '10.2.10.113', status: 'ok' },
      { id: 'QFAC-033', floor: '3', client: 'ALELO', room: 'C', ip: '10.2.10.114', status: 'fail' },
      { id: 'QFAC-034', floor: '3', client: 'ALELO', room: 'D', ip: '10.2.10.115', status: 'fail' },

      // 4º PAV (ALELO)
      { id: 'QFAC-043', floor: '4', client: 'ALELO', room: 'A', ip: '10.2.10.108', status: 'fail' },
      { id: 'QFAC-042', floor: '4', client: 'ALELO', room: 'B', ip: '10.2.10.109', status: 'ok' },
      { id: 'QFAC-041', floor: '4', client: 'ALELO', room: 'C', ip: '10.2.10.110', status: 'ok' },
      { id: 'QFAC-044', floor: '4', client: 'ALELO', room: 'D', ip: '10.2.10.111', status: 'ok' },

      // 8º PAV (ELOPAR)
      { id: 'QFAC-081', floor: '8', client: 'ELOPAR', room: 'A', ip: '10.2.10.104', status: 'ok' },
      { id: 'QFAC-082', floor: '8', client: 'ELOPAR', room: 'B', ip: '10.2.10.105', status: 'ok' },
      { id: 'QFAC-083', floor: '8', client: 'ELOPAR', room: 'C', ip: '10.2.10.106', status: 'ok' },
      { id: 'QFAC-084', floor: '8', client: 'ELOPAR', room: 'D', ip: '10.2.10.107', status: 'ok' },

      // 11º PAV (LIVELO)
      { id: 'QE 02-113', floor: '11', client: 'LIVELO', room: 'C', ip: '10.2.10.102', status: 'fail' },
      { id: 'QE 01-114', floor: '11', client: 'LIVELO', room: 'D', ip: '10.2.10.103', status: 'fail' },

      // 16º PAV (VELOE)
      { id: 'QFAC-161', floor: '16', client: 'VELOE', room: 'A', ip: '10.2.10.100', status: 'ok' },
      { id: 'QFAC-162', floor: '16', client: 'VELOE', room: 'B', ip: '10.2.10.101', status: 'fail' }
    ];

    let currentFloor = 'ALL';
    let onlyFailures = false;

    function updateKPIs(dataset) {
      const total = dataset.length;
      const ok = dataset.filter(m => m.status === 'ok').length;
      const fail = dataset.filter(m => m.status === 'fail').length;

      document.getElementById('kpi-total').innerText = total;
      document.getElementById('kpi-ok').innerText = ok;
      document.getElementById('kpi-fail').innerText = fail;
    }

    function renderMeters() {
      const rooms = ['A', 'B', 'C', 'D'];
      
      const scopedFloorMeters = meters.filter(m => 
        currentFloor === 'ALL' || m.floor === currentFloor
      );

      updateKPIs(scopedFloorMeters);

      rooms.forEach(room => {
        const container = document.getElementById(`list-${room}`);
        const countBadge = document.getElementById(`count-${room}`);
        container.innerHTML = '';

        const filtered = scopedFloorMeters.filter(m => {
          const matchRoom = m.room === room;
          const matchFail = onlyFailures ? m.status === 'fail' : true;
          return matchRoom && matchFail;
        });

        countBadge.innerText = filtered.length;

        if (filtered.length === 0) {
          container.innerHTML = '<div class="empty-state">Nenhum medidor</div>';
          return;
        }

        filtered.forEach(m => {
          const card = document.createElement('div');
          card.className = `meter-card ${m.status}`;
          card.innerHTML = `
            <div class="meter-info">
              <span class="meter-id">${m.id}</span>
              <span class="meter-meta">${m.client} • ${m.floor}º PAV • ${m.ip}</span>
            </div>
            <div class="meter-status">
              <span class="pulse-dot ${m.status}"></span>
            </div>
          `;
          container.appendChild(card);
        });
      });
    }

    function setFloor(floor, btn) {
      currentFloor = floor;
      document.querySelectorAll('.btn-floor').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const floorDisplay = document.getElementById('floorDisplay');
      floorDisplay.innerText = floor === 'ALL' ? 'Vista Global' : `${floor}º Pavimento`;

      renderMeters();
    }

    function toggleOnlyFailures() {
      onlyFailures = !onlyFailures;
      const btn = document.getElementById('toggleFailBtn');
      btn.classList.toggle('active', onlyFailures);
      btn.innerText = onlyFailures ? 'Mostrar todos' : 'Apenas falhas';
      renderMeters();
    }

    renderMeters();
  </script>
</body>
</html>
