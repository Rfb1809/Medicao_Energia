<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Supervisório de Medidores - Alameda Xingu</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --room-bg: #0b1120;
      --border: #1f293d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --ok: #10b981;
      --ok-soft: rgba(16, 185, 129, 0.15);
      --fail: #ef4444;
      --fail-soft: rgba(239, 68, 68, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Top Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* Quick Stats */
    .status-summary {
      display: flex;
      gap: 6px;
    }

    .pill {
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pill.total { background: #1e293b; color: #cbd5e1; }
    .pill.ok { background: var(--ok-soft); color: var(--ok); }
    .pill.fail { background: var(--fail-soft); color: var(--fail); }

    /* Barra de Rolagem de Andares */
    .selector-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .selector-bar::-webkit-scrollbar { display: none; }

    .btn-floor {
      background: #111827;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 16px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.75rem;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .btn-floor.active {
      background: var(--accent);
      border-color: #3b82f6;
      color: #fff;
    }

    /* Referência de Rua */
    .street-indicator {
      width: 100%;
      text-align: center;
      font-weight: 800;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #60a5fa;
      padding: 3px;
      border-bottom: 1.5px dashed rgba(59, 130, 246, 0.5);
    }

    /* Planta Arquitetónica Grid */
    .floor-plan {
      width: 100%;
      background: #0f172a;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(170px, 1fr) minmax(170px, 1fr);
      gap: 8px;
      position: relative;
    }

    /* Centro da Planta */
    .plan-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(11, 17, 32, 0.94);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      border-radius: 8px;
      padding: 8px 12px;
      text-align: center;
      pointer-events: none;
      z-index: 5;
      min-width: 130px;
    }

    .plan-center strong {
      display: block;
      font-size: 0.8rem;
      color: #f1f5f9;
    }

    .plan-center span {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    /* Casas de Máquinas (Quinas) */
    .corner-room {
      background: var(--room-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 160px;
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 4px;
    }

    .room-title {
      font-weight: 800;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .room-title small {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .room-count {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    /* Lista interna de medidores */
    .meters-grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      flex: 1;
      padding-right: 2px;
    }

    .meters-grid::-webkit-scrollbar {
      width: 3px;
    }
    .meters-grid::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    /* Cartão do medidor */
    .meter-card {
      background: #141d30;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 5px;
      padding: 5px 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .meter-card:active {
      transform: scale(0.98);
      background: #1a243c;
    }

    .meter-card.fail {
      background: var(--fail-soft);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .meter-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .meter-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
    }

    .meter-sub {
      font-size: 0.62rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.ok {
      background: var(--ok);
      box-shadow: 0 0 5px var(--ok);
    }

    .status-dot.fail {
      background: var(--fail);
      box-shadow: 0 0 6px var(--fail);
      animation: pulse-fail 1.2s infinite;
    }

    @keyframes pulse-fail {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    .empty-state {
      font-size: 0.68rem;
      color: #475569;
      text-align: center;
      margin-top: auto;
      margin-bottom: auto;
    }

    /* Modal / Bottom Sheet para Detalhe Técnico */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(2px);
      display: none;
      align-items: flex-end;
      z-index: 100;
    }

    .modal-sheet {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: #111827;
      border-top: 2px solid var(--accent);
      border-radius: 16px 16px 0 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sheet-title {
      font-size: 1rem;
      font-weight: 800;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #090d16;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.75rem;
    }

    .detail-item strong {
      display: block;
      color: var(--text-muted);
      font-size: 0.65rem;
      text-transform: uppercase;
    }

    /* Desktop View Tweaks */
    @media (min-width: 768px) {
      .floor-plan {
        height: 520px;
        grid-template-columns: 240px 1fr 240px;
        grid-template-rows: 230px 1fr 230px;
      }
      .room-d { grid-column: 1; grid-row: 1; }
      .room-c { grid-column: 3; grid-row: 1; }
      .room-b { grid-column: 1; grid-row: 3; }
      .room-a { grid-column: 3; grid-row: 3; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Planta de Supervisão</h1>
      <div class="status-summary">
        <span class="pill total" id="kpi-total">0</span>
        <span class="pill ok" id="kpi-ok">0 OK</span>
        <span class="pill fail" id="kpi-fail">0 FALHA</span>
      </div>
    </header>

    <!-- Seletor de Andares Rápido -->
    <div class="selector-bar">
      <button class="btn-floor active" onclick="setFloor('ALL', this)">Todos</button>
      <button class="btn-floor" onclick="setFloor('1', this)">1º (Livelo)</button>
      <button class="btn-floor" onclick="setFloor('2', this)">2º (Elopar)</button>
      <button class="btn-floor" onclick="setFloor('3', this)">3º (Alelo)</button>
      <button class="btn-floor" onclick="setFloor('4', this)">4º (Alelo)</button>
      <button class="btn-floor" onclick="setFloor('8', this)">8º (Elopar)</button>
      <button class="btn-floor" onclick="setFloor('11', this)">11º (Livelo)</button>
      <button class="btn-floor" onclick="setFloor('16', this)">16º (Veloe)</button>
    </div>

    <!-- Indicador Norte/Rua -->
    <div class="street-indicator">▲ Alameda Xingu (Norte) ▲</div>

    <!-- Layout da Planta Arquitetónica -->
    <div class="floor-plan">
      
      <!-- Centro do Prédio -->
      <div class="plan-center">
        <strong id="floorDisplay">Vista Global</strong>
        <span>Vão Central</span>
      </div>

      <!-- Quina Noroeste: D -->
      <div class="corner-room room-d">
        <div class="room-header">
          <span class="room-title">D <small>Sup. Esq.</small></span>
          <span class="room-count" id="count-D">0</span>
        </div>
        <div class="meters-grid" id="list-D"></div>
      </div>

      <!-- Quina Nordeste: C -->
      <div class="corner-room room-c">
        <div class="room-header">
          <span class="room-title">C <small>Sup. Dir.</small></span>
          <span class="room-count" id="count-C">0</span>
        </div>
        <div class="meters-grid" id="list-C"></div>
      </div>

      <!-- Quina Sudoeste: B -->
      <div class="corner-room room-b">
        <div class="room-header">
          <span class="room-title">B <small>Inf. Esq.</small></span>
          <span class="room-count" id="count-B">0</span>
        </div>
        <div class="meters-grid" id="list-B"></div>
      </div>

      <!-- Quina Sudeste: A -->
      <div class="corner-room room-a">
        <div class="room-header">
          <span class="room-title">A <small>Inf. Dir.</small></span>
          <span class="room-count" id="count-A">0</span>
        </div>
        <div class="meters-grid" id="list-A"></div>
      </div>

    </div>
  </div>

  <!-- Modal com Dados de Manutenção do Medidor -->
  <div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <span class="sheet-title" id="m-id">--</span>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="detail-grid">
        <div class="detail-item">
          <strong>Pavimento</strong>
          <span id="m-floor">--</span>
        </div>
        <div class="detail-item">
          <strong>Cliente</strong>
          <span id="m-client">--</span>
        </div>
        <div class="detail-item">
          <strong>Casa de Máquinas</strong>
          <span id="m-room">--</span>
        </div>
        <div class="detail-item">
          <strong>Endereço IP</strong>
          <span id="m-ip">--</span>
        </div>
        <div class="detail-item" style="grid-column: span 2;">
          <strong>Estado de Ligação</strong>
          <span id="m-status">--</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const meters = [
      { id: 'QFAC-011', floor: '1', client: 'LIVELO', room: 'A', ip: '10.2.10.118', status: 'fail' },
      { id: 'QFAC-012', floor: '1', client: 'LIVELO', room: 'B', ip: '10.2.10.119', status: 'ok' },
      { id: 'QFAC-013', floor: '1', client: 'LIVELO', room: 'C', ip: '10.2.10.120', status: 'ok' },
      { id: 'QFAC-014', floor: '1', client: 'LIVELO', room: 'D', ip: '10.2.10.121', status: 'fail' },

      { id: 'QFAC-023', floor: '2', client: 'ELOPAR', room: 'C', ip: '10.2.10.116', status: 'ok' },
      { id: 'QFAC-024', floor: '2', client: 'ELOPAR', room: 'D', ip: '10.2.10.117', status: 'ok' },

      { id: 'QFAC-031', floor: '3', client: 'ALELO', room: 'A', ip: '10.2.10.112', status: 'fail' },
      { id: 'QFAC-032', floor: '3', client: 'ALELO', room: 'B', ip: '10.2.10.113', status: 'ok' },
      { id: 'QFAC-033', floor: '3', client: 'ALELO', room: 'C', ip: '10.2.10.114', status: 'fail' },
      { id: 'QFAC-034', floor: '3', client: 'ALELO', room: 'D', ip: '10.2.10.115', status: 'fail' },

      { id: 'QFAC-043', floor: '4', client: 'ALELO', room: 'A', ip: '10.2.10.108', status: 'fail' },
      { id: 'QFAC-042', floor: '4', client: 'ALELO', room: 'B', ip: '10.2.10.109', status: 'ok' },
      { id: 'QFAC-041', floor: '4', client: 'ALELO', room: 'C', ip: '10.2.10.110', status: 'ok' },
      { id: 'QFAC-044', floor: '4', client: 'ALELO', room: 'D', ip: '10.2.10.111', status: 'ok' },

      { id: 'QFAC-081', floor: '8', client: 'ELOPAR', room: 'A', ip: '10.2.10.104', status: 'ok' },
      { id: 'QFAC-082', floor: '8', client: 'ELOPAR', room: 'B', ip: '10.2.10.105', status: 'ok' },
      { id: 'QFAC-083', floor: '8', client: 'ELOPAR', room: 'C', ip: '10.2.10.106', status: 'ok' },
      { id: 'QFAC-084', floor: '8', client: 'ELOPAR', room: 'D', ip: '10.2.10.107', status: 'ok' },

      { id: 'QE 02-113', floor: '11', client: 'LIVELO', room: 'C', ip: '10.2.10.102', status: 'fail' },
      { id: 'QE 01-114', floor: '11', client: 'LIVELO', room: 'D', ip: '10.2.10.103', status: 'fail' },

      { id: 'QFAC-161', floor: '16', client: 'VELOE', room: 'A', ip: '10.2.10.100', status: 'ok' },
      { id: 'QFAC-162', floor: '16', client: 'VELOE', room: 'B', ip: '10.2.10.101', status: 'fail' }
    ];

    let currentFloor = 'ALL';

    function render() {
      const filtered = meters.filter(m => currentFloor === 'ALL' || m.floor === currentFloor);

      // Atualiza KPIs
      document.getElementById('kpi-total').innerText = `${filtered.length} Totais`;
      document.getElementById('kpi-ok').innerText = `${filtered.filter(m => m.status === 'ok').length} OK`;
      document.getElementById('kpi-fail').innerText = `${filtered.filter(m => m.status === 'fail').length} Falha`;

      const rooms = ['A', 'B', 'C', 'D'];
      rooms.forEach(room => {
        const list = document.getElementById(`list-${room}`);
        const count = document.getElementById(`count-${room}`);
        list.innerHTML = '';

        const roomMeters = filtered.filter(m => m.room === room);
        count.innerText = roomMeters.length;

        if (roomMeters.length === 0) {
          list.innerHTML = '<div class="empty-state">Sem medidores</div>';
          return;
        }

        roomMeters.forEach(m => {
          const card = document.createElement('div');
          card.className = `meter-card ${m.status}`;
          card.onclick = () => openDetails(m);
          card.innerHTML = `
            <div class="meter-meta">
              <span class="meter-name">${m.id}</span>
              <span class="meter-sub">${m.client} • ${m.floor}º</span>
            </div>
            <span class="status-dot ${m.status}"></span>
          `;
          list.appendChild(card);
        });
      });
    }

    function setFloor(floor, btn) {
      currentFloor = floor;
      document.querySelectorAll('.btn-floor').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.getElementById('floorDisplay').innerText = floor === 'ALL' ? 'Vista Global' : `${floor}º Pavimento`;
      render();
    }

    function openDetails(meter) {
      document.getElementById('m-id').innerText = meter.id;
      document.getElementById('m-floor').innerText = `${meter.floor}º Pavimento`;
      document.getElementById('m-client').innerText = meter.client;
      document.getElementById('m-room').innerText = `Quina ${meter.room}`;
      document.getElementById('m-ip').innerText = meter.ip;
      
      const statusEl = document.getElementById('m-status');
      if (meter.status === 'ok') {
        statusEl.innerHTML = '<span style="color:var(--ok)">● Comunicação Normal</span>';
      } else {
        statusEl.innerHTML = '<span style="color:var(--fail)">● Falha de Comunicação</span>';
      }

      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal(event) {
      if (!event || event.target.id === 'detailModal' || event.target.classList.contains('close-btn')) {
        document.getElementById('detailModal').style.display = 'none';
      }
    }

    render();
  </script>
</body>
</html>
