<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisório de Medidores - Alameda Xingu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 6px;
    }

    .selector-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .btn-floor {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .btn-floor:hover {
      background: #334155;
      color: #fff;
    }

    .btn-floor.active {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #ffffff;
    }

    .street-indicator {
      width: 100%;
      max-width: 900px;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #93c5fd;
      border-bottom: 2px dashed #3b82f6;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    /* Estrutura da Planta Retangular */
    .building-container {
      width: 100%;
      max-width: 900px;
      height: 480px;
      background-color: #3b6cb8;
      border-radius: 4px;
      position: relative;
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      grid-template-rows: 210px 1fr 210px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .center-label {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .center-label strong {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 4px;
    }

    /* Casas de Máquinas nas Quinas */
    .corner-room {
      background-color: #000000;
      padding: 12px;
      display: flex;
      flex-direction: column;
      border: 1px solid #1e293b;
      overflow-y: auto;
    }

    /* Posições de acordo com a referência */
    .room-d { grid-column: 1; grid-row: 1; }
    .room-c { grid-column: 3; grid-row: 1; }
    .room-b { grid-column: 1; grid-row: 3; }
    .room-a { grid-column: 3; grid-row: 3; }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .room-title {
      font-weight: 800;
      font-size: 1.1rem;
      color: #ffffff;
    }

    .room-badge {
      font-size: 0.7rem;
      background: #222;
      color: #aaa;
      padding: 2px 6px;
      border-radius: 3px;
    }

    /* Lista de Medidores */
    .meters-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meter-card {
      background: #111;
      border-radius: 4px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 4px solid #555;
      font-size: 0.75rem;
    }

    .meter-card.ok {
      border-left-color: #22c55e;
    }

    .meter-card.fail {
      border-left-color: #ef4444;
      background: #1c1315;
    }

    .meter-info {
      display: flex;
      flex-direction: column;
    }

    .meter-name {
      font-weight: 700;
      color: #fff;
    }

    .meter-client {
      color: #94a3b8;
      font-size: 0.7rem;
    }

    .meter-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-dot.ok {
      background-color: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    .status-dot.fail {
      background-color: #ef4444;
      box-shadow: 0 0 6px #ef4444;
    }

    .empty-state {
      font-size: 0.75rem;
      color: #666;
      text-align: center;
      margin-top: 20px;
    }

    /* Legenda */
    .legend {
      display: flex;
      gap: 20px;
      margin-top: 18px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Supervisório de Medição de Energia</h1>
  </header>

  <!-- Filtro por Andar -->
  <div class="selector-bar" id="floorSelector">
    <button class="btn-floor active" onclick="filterFloor('ALL', this)">Todos os Andares</button>
    <button class="btn-floor" onclick="filterFloor('1', this)">1º PAV (LIVELO)</button>
    <button class="btn-floor" onclick="filterFloor('2', this)">2º PAV (ELOPAR)</button>
    <button class="btn-floor" onclick="filterFloor('3', this)">3º PAV (ALELO)</button>
    <button class="btn-floor" onclick="filterFloor('4', this)">4º PAV (ALELO)</button>
    <button class="btn-floor" onclick="filterFloor('8', this)">8º PAV (ELOPAR)</button>
    <button class="btn-floor" onclick="filterFloor('11', this)">11º PAV (LIVELO)</button>
    <button class="btn-floor" onclick="filterFloor('16', this)">16º PAV (VELOE)</button>
  </div>

  <!-- Referência Topo -->
  <div class="street-indicator">▲ Alameda Xingu ▲</div>

  <!-- Prédio e Casas de Máquinas -->
  <div class="building-container">
    
    <!-- Quina Noroeste: D -->
    <div class="corner-room room-d">
      <div class="room-header">
        <span class="room-title">D</span>
        <span class="room-badge">Quina Sup. Esq.</span>
      </div>
      <div class="meters-list" id="list-D"></div>
    </div>

    <!-- Centro do Edifício -->
    <div class="center-label">
      <strong id="floorDisplay">Vista Global</strong>
      <span>Vão Central</span>
    </div>

    <!-- Quina Nordeste: C -->
    <div class="corner-room room-c">
      <div class="room-header">
        <span class="room-title">C</span>
        <span class="room-badge">Quina Sup. Dir.</span>
      </div>
      <div class="meters-list" id="list-C"></div>
    </div>

    <!-- Quina Sudoeste: B -->
    <div class="corner-room room-b">
      <div class="room-header">
        <span class="room-title">B</span>
        <span class="room-badge">Quina Inf. Esq.</span>
      </div>
      <div class="meters-list" id="list-B"></div>
    </div>

    <!-- Quina Sudeste: A -->
    <div class="corner-room room-a">
      <div class="room-header">
        <span class="room-title">A</span>
        <span class="room-badge">Quina Inf. Dir.</span>
      </div>
      <div class="meters-list" id="list-A"></div>
    </div>

  </div>

  <!-- Legenda -->
  <div class="legend">
    <div class="legend-item">
      <span class="status-dot ok"></span>
      <span>Comunicação Normal</span>
    </div>
    <div class="legend-item">
      <span class="status-dot fail"></span>
      <span>Falha de Comunicação</span>
    </div>
  </div>

  <script>
    // Lista completa dos medidores conforme o sistema
    const meters = [
      // 1º PAV (LIVELO)
      { id: 'QFAC-011', floor: '1', client: 'LIVELO', room: 'A', ip: '10.2.10.118', status: 'fail' },
      { id: 'QFAC-012', floor: '1', client: 'LIVELO', room: 'B', ip: '10.2.10.119', status: 'ok' },
      { id: 'QFAC-013', floor: '1', client: 'LIVELO', room: 'C', ip: '10.2.10.120', status: 'ok' },
      { id: 'QFAC-014', floor: '1', client: 'LIVELO', room: 'D', ip: '10.2.10.121', status: 'fail' },

      // 2º PAV (ELOPAR)
      { id: 'QFAC-023', floor: '2', client: 'ELOPAR', room: 'C', ip: '10.2.10.116', status: 'ok' },
      { id: 'QFAC-024', floor: '2', client: 'ELOPAR', room: 'D', ip: '10.2.10.117', status: 'ok' },

      // 3º PAV (ALELO)
      { id: 'QFAC-031', floor: '3', client: 'ALELO', room: 'A', ip: '10.2.10.112', status: 'fail' },
      { id: 'QFAC-032', floor: '3', client: 'ALELO', room: 'B', ip: '10.2.10.113', status: 'ok' },
      { id: 'QFAC-033', floor: '3', client: 'ALELO', room: 'C', ip: '10.2.10.114', status: 'fail' },
      { id: 'QFAC-034', floor: '3', client: 'ALELO', room: 'D', ip: '10.2.10.115', status: 'fail' },

      // 4º PAV (ALELO)
      { id: 'QFAC-043', floor: '4', client: 'ALELO', room: 'A', ip: '10.2.10.108', status: 'fail' },
      { id: 'QFAC-042', floor: '4', client: 'ALELO', room: 'B', ip: '10.2.10.109', status: 'ok' },
      { id: 'QFAC-041', floor: '4', client: 'ALELO', room: 'C', ip: '10.2.10.110', status: 'ok' },
      { id: 'QFAC-044', floor: '4', client: 'ALELO', room: 'D', ip: '10.2.10.111', status: 'ok' },

      // 8º PAV (ELOPAR)
      { id: 'QFAC-081', floor: '8', client: 'ELOPAR', room: 'A', ip: '10.2.10.104', status: 'ok' },
      { id: 'QFAC-082', floor: '8', client: 'ELOPAR', room: 'B', ip: '10.2.10.105', status: 'ok' },
      { id: 'QFAC-083', floor: '8', client: 'ELOPAR', room: 'C', ip: '10.2.10.106', status: 'ok' },
      { id: 'QFAC-084', floor: '8', client: 'ELOPAR', room: 'D', ip: '10.2.10.107', status: 'ok' },

      // 11º PAV (LIVELO)
      { id: 'QE 02-113', floor: '11', client: 'LIVELO', room: 'C', ip: '10.2.10.102', status: 'fail' },
      { id: 'QE 01-114', floor: '11', client: 'LIVELO', room: 'D', ip: '10.2.10.103', status: 'fail' },

      // 16º PAV (VELOE)
      { id: 'QFAC-161', floor: '16', client: 'VELOE', room: 'A', ip: '10.2.10.100', status: 'ok' },
      { id: 'QFAC-162', floor: '16', client: 'VELOE', room: 'B', ip: '10.2.10.101', status: 'fail' }
    ];

    let currentFloor = 'ALL';

    function renderMeters() {
      const rooms = ['A', 'B', 'C', 'D'];
      
      rooms.forEach(room => {
        const container = document.getElementById(`list-${room}`);
        container.innerHTML = '';

        const filtered = meters.filter(m => {
          const matchRoom = m.room === room;
          const matchFloor = (currentFloor === 'ALL') || (m.floor === currentFloor);
          return matchRoom && matchFloor;
        });

        if (filtered.length === 0) {
          container.innerHTML = '<div class="empty-state">Sem medidores</div>';
          return;
        }

        filtered.forEach(m => {
          const card = document.createElement('div');
          card.className = `meter-card ${m.status}`;
          card.innerHTML = `
            <div class="meter-info">
              <span class="meter-name">${m.id}</span>
              <span class="meter-client">${m.client} - ${m.floor}º PAV</span>
            </div>
            <div class="meter-status">
              <span class="status-dot ${m.status}"></span>
            </div>
          `;
          container.appendChild(card);
        });
      });
    }

    function filterFloor(floor, btn) {
      currentFloor = floor;
      
      document.querySelectorAll('.btn-floor').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const floorDisplay = document.getElementById('floorDisplay');
      floorDisplay.innerText = floor === 'ALL' ? 'Vista Global' : `${floor}º Pavimento`;

      renderMeters();
    }

    // Inicialização
    renderMeters();
  </script>
</body>
</html>
